name: Build Python application

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release-Version (z.B. v1.0.0). Leer lassen = kein Release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  APP_SCRIPT: AES_Crypto_Tool.py
  APP_NAME: aescrypto
  PYTHON_VERSION: "3.12.3"
  PYINSTALLER_VERSION: "6.22.3"

jobs:
  # ============================================================
  # Linux Build
  # ============================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify source script
        shell: bash
        run: |
          if [[ ! -f "$APP_SCRIPT" ]]; then
            echo "ERROR: $APP_SCRIPT wurde im Repository-Root nicht gefunden."
            exit 1
          fi
          python -m py_compile "$APP_SCRIPT"
          ls -lh "$APP_SCRIPT"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "cryptography>=41.0" \
            "PySide6>=6.6" \
            "Pillow>=10.0" \
            "pyinstaller==$PYINSTALLER_VERSION"

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --windowed \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            --collect-all cryptography \
            --name "$APP_NAME" \
            "$APP_SCRIPT"

      - name: Verify Linux executable
        shell: bash
        run: |
          if [[ ! -f "dist/$APP_NAME" ]]; then
            echo "ERROR: Linux executable wurde nicht erzeugt."
            exit 1
          fi
          chmod +x "dist/$APP_NAME"
          ls -lh "dist/$APP_NAME"
          file "dist/$APP_NAME"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: aescrypto-linux
          path: dist/aescrypto
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # Windows Build
  # ============================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Verify source script and icon
        shell: pwsh
        run: |
          if (-not (Test-Path $env:APP_SCRIPT)) {
            throw "ERROR: $env:APP_SCRIPT wurde im Repository-Root nicht gefunden."
          }
          if (-not (Test-Path "aescrypto.ico")) {
            throw "ERROR: aescrypto.ico wurde im Repository-Root nicht gefunden."
          }
          python -m py_compile $env:APP_SCRIPT
          Get-Item $env:APP_SCRIPT, "aescrypto.ico" | Select-Object Name, Length

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install `
            "cryptography>=41.0" `
            "PySide6>=6.6" `
            "Pillow>=10.0" `
            "pyinstaller==$env:PYINSTALLER_VERSION"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --noupx `
            --windowed `
            --icon="$PWD\aescrypto.ico" `
            --add-data "aescrypto.ico;." `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --collect-all cryptography `
            --name "$env:APP_NAME" `
            "$env:APP_SCRIPT"

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $exe = "dist\$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) {
            throw "ERROR: $exe wurde nicht erzeugt."
          }
          Get-Item $exe | Select-Object Name, Length, FullName

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: aescrypto-windows
          path: dist/aescrypto.exe
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # GitHub Release
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    if: always() && inputs.release_version != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check build results
        shell: bash
        env:
          LINUX_RESULT: ${{ needs.build-linux.result }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
        run: |
          echo "Linux build:   $LINUX_RESULT"
          echo "Windows build: $WINDOWS_RESULT"
          if [[ "$LINUX_RESULT" != "success" && "$WINDOWS_RESULT" != "success" ]]; then
            echo "ERROR: Beide Builds sind fehlgeschlagen. Es wird kein Release erstellt."
            exit 1
          fi

      - name: Download Linux artifact
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: aescrypto-linux
          path: release

      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: aescrypto-windows
          path: release

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_VERSION"

          if [[ ! "$TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Ungültige Release-Version: $TAG (Beispiel: v1.0.0)"
            exit 1
          fi

          FILES=()
          [[ -f release/aescrypto ]] && FILES+=("release/aescrypto")
          [[ -f release/aescrypto.exe ]] && FILES+=("release/aescrypto.exe")

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "ERROR: Keine Build-Artefakte gefunden."
            exit 1
          fi

          echo "Release-Dateien:"
          printf '%s\n' "${FILES[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TAG" \
              --generate-notes
          fi

          echo "Release $TAG erfolgreich erstellt/aktualisiert."