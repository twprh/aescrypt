name: Build Python application

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release-Version (z.B. v1.0.0). Leer lassen = kein Release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:

  # ============================================================
  # Linux Build
  # ============================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Verify icon
        shell: bash
        run: |
          if [[ ! -f "aescrypto.ico" ]]; then
            echo "ERROR: aescrypto.ico wurde im Repository-Root nicht gefunden."
            exit 1
          fi

          echo "Icon gefunden:"
          ls -lh aescrypto.ico

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --windowed \
            --icon="$PWD/aescrypto.ico" \
            --collect-all tkinterdnd2 \
            --hidden-import=pystray.win32 \
            --name aescrypto \
            main.py

      - name: Verify Linux executable
        shell: bash
        run: |
          if [[ ! -f "dist/aescrypto" ]]; then
            echo "ERROR: Linux executable wurde nicht erzeugt."
            exit 1
          fi

          echo "Linux executable:"
          ls -lh dist/aescrypto
          du -h dist/aescrypto

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: aescrypto-linux
          path: dist/aescrypto
          if-no-files-found: error


  # ============================================================
  # Windows Build
  # ============================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      # ----------------------------------------------------------
      # Prüfen, ob das Icon wirklich im Repository-Root liegt
      # ----------------------------------------------------------
      - name: Verify icon
        shell: pwsh
        run: |
          if (-not (Test-Path "aescrypto.ico")) {
            Write-Error "ERROR: aescrypto.ico wurde im Repository-Root nicht gefunden."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Icon gefunden"
          Write-Host "========================================"

          Get-Item "aescrypto.ico" |
            Select-Object FullName, Length

          Write-Host ""

      # ----------------------------------------------------------
      # PyInstaller Build
      # ----------------------------------------------------------
      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --icon="$PWD\aescrypto.ico" `
            --add-data "aescrypto.ico;." `
            --collect-submodules tkinterdnd2 `
            --hidden-import=pystray._win32 `
            --name aescrypto `
            main.py

      # ----------------------------------------------------------
      # Prüfen, ob die EXE erzeugt wurde
      # ----------------------------------------------------------
      - name: Verify Windows executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\aescrypto.exe")) {
            Write-Error "ERROR: aescrypto.exe wurde nicht erzeugt."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Windows executable erfolgreich erzeugt"
          Write-Host "========================================"

          Get-Item "dist\aescrypto.exe" |
            Select-Object Name, Length, FullName

          Write-Host ""

      # ----------------------------------------------------------
      # Artifact hochladen
      # ----------------------------------------------------------
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: aescrypto-windows
          path: dist/aescrypto.exe
          if-no-files-found: error


  # ============================================================
  # GitHub Release
  # ============================================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-windows

    # Release nur erstellen, wenn release_version angegeben wurde.
    # Der Build selbst muss nicht zwingend auf beiden Plattformen
    # erfolgreich sein.
    if: |
      always() &&
      inputs.release_version != ''

    steps:

      # ----------------------------------------------------------
      # Repository auschecken
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ----------------------------------------------------------
      # Build-Ergebnisse prüfen
      # ----------------------------------------------------------
      - name: Check build results
        shell: bash
        run: |
          echo "Linux build:   ${{ needs.build-linux.result }}"
          echo "Windows build: ${{ needs.build-windows.result }}"

          if [[ "${{ needs.build-linux.result }}" != "success" ]] && \
             [[ "${{ needs.build-windows.result }}" != "success" ]]; then
            echo ""
            echo "ERROR: Beide Builds sind fehlgeschlagen."
            echo "Es wird kein Release erstellt."
            exit 1
          fi

      # ----------------------------------------------------------
      # Linux Artifact herunterladen
      # ----------------------------------------------------------
      - name: Download Linux artifact
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: aescrypto-linux
          path: release

      # ----------------------------------------------------------
      # Windows Artifact herunterladen
      # ----------------------------------------------------------
      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: aescrypto-windows
          path: release

      # ----------------------------------------------------------
      # GitHub Release erstellen / aktualisieren
      # ----------------------------------------------------------
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          TAG="${{ inputs.release_version }}"

          echo "Release version: $TAG"

          # ------------------------------------------------------
          # Version prüfen
          # ------------------------------------------------------
          if [[ "$TAG" != v* && "$TAG" != V* ]]; then
            echo ""
            echo "ERROR: Release version must start with 'v'."
            echo "Example: v1.0.0"
            exit 1
          fi

          # ------------------------------------------------------
          # Vorhandene Build-Dateien sammeln
          # ------------------------------------------------------
          FILES=()

          if [[ -f "release/aescrypto" ]]; then
            FILES+=("release/aescrypto")
          fi

          if [[ -f "release/aescrypto.exe" ]]; then
            FILES+=("release/aescrypto.exe")
          fi

          # ------------------------------------------------------
          # Prüfen, ob mindestens ein Build vorhanden ist
          # ------------------------------------------------------
          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo ""
            echo "ERROR: No build artifacts found."
            exit 1
          fi

          echo ""
          echo "Files for release:"
          printf '%s\n' "${FILES[@]}"

          # ------------------------------------------------------
          # Release existiert bereits?
          # ------------------------------------------------------
          if gh release view "$TAG" >/dev/null 2>&1; then

            echo ""
            echo "Release $TAG already exists."
            echo "Uploading new build artifacts..."

            gh release upload \
              "$TAG" \
              "${FILES[@]}" \
              --clobber

          else

            echo ""
            echo "Creating new GitHub Release $TAG..."

            gh release create \
              "$TAG" \
              "${FILES[@]}" \
              --title "$TAG" \
              --generate-notes

          fi

          echo ""
          echo "========================================"
          echo "Release successfully created/updated"
          echo "Version: $TAG"
          echo "========================================"
