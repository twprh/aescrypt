name: Build Python application cli

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release-Version (z.B. v1.0.0). Leer lassen = kein Release."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Verify icon
        shell: bash
        run: |
          if [[ ! -f "aescrypto.ico" ]]; then
            echo "ERROR: aescrypto.ico wurde im Repository-Root nicht gefunden."
            exit 1
          fi

          echo "Icon gefunden:"
          ls -lh aescrypto.ico

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --console \
            --icon="$PWD/aescrypto.ico" \
            --add-data "aescrypto.ico:." \
            --name aescrypto-cli \
            aes_cli.py

      - name: Show Linux executable size
        run: |
          ls -lh dist/aescrypto-cli
          du -h dist/aescrypto-cli

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: aescrypto-cli-linux
          path: dist/aescrypto-cli
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Verify icon
        shell: pwsh
        run: |
          if (-not (Test-Path "aescrypto.ico")) {
            Write-Error "ERROR: aescrypto.ico wurde im Repository-Root nicht gefunden."
            exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Icon gefunden"
          Write-Host "========================================"

          Get-Item "aescrypto.ico" |
            Select-Object FullName, Length

          Write-Host ""

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --console `
            --icon="$PWD\aescrypto.ico" `
            --add-data "aescrypto.ico;." `
            --name aescrypto-cli `
            aes_cli.py

      - name: Show Windows executable size
        shell: pwsh
        run: |
          Get-Item "dist\aescrypto-cli.exe" |
            Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: aescrypto-cli-windows
          path: dist/aescrypto-cli.exe
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    needs:
      - build-linux
      - build-windows

    if: |
      always() &&
      inputs.release_version != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check build results
        shell: bash
        run: |
          echo "Linux build:   ${{ needs.build-linux.result }}"
          echo "Windows build: ${{ needs.build-windows.result }}"

          if [[ "${{ needs.build-linux.result }}" != "success" ]] && \
             [[ "${{ needs.build-windows.result }}" != "success" ]]; then
            echo "Both builds failed."
            echo "No release will be created."
            exit 1
          fi

      - name: Download Linux artifact
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: aescrypto-cli-linux
          path: release

      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: aescrypto-cli-windows
          path: release

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          TAG="${{ inputs.release_version }}"

          echo "Release version: $TAG"

          if [[ "$TAG" != v* && "$TAG" != V* ]]; then
            echo "ERROR: Release version must start with 'v'."
            echo "Example: v1.0.0"
            exit 1
          fi

          FILES=()

          if [[ -f "release/aescrypto-cli" ]]; then
            FILES+=("release/aescrypto-cli")
          fi

          if [[ -f "release/aescrypto-cli.exe" ]]; then
            FILES+=("release/aescrypto-cli.exe")
          fi

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "ERROR: No build artifacts found."
            exit 1
          fi

          echo "Files for release:"
          printf '%s\n' "${FILES[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."

            gh release upload \
              "$TAG" \
              "${FILES[@]}" \
              --clobber

          else
            echo "Creating new GitHub Release $TAG..."

            gh release create \
              "$TAG" \
              "${FILES[@]}" \
              --title "$TAG" \
              --generate-notes
          fi

          echo "Release successfully created/updated: $TAG"
