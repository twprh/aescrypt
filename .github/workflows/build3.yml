name: Build Python application

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  # ============================================================
  # LINUX
  # ============================================================

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --windowed \
            --collect-all tkinterdnd2 \
            --name aescrypto \
            main.py

      - name: Rename Linux executable
        run: |
          mv dist/aescrypto dist/aescrypto-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: aescrypto-linux
          path: dist/aescrypto-linux
          if-no-files-found: error


  # ============================================================
  # WINDOWS
  # ============================================================

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller `
            --clean `
            --noconfirm `
            --onefile `
            --windowed `
            --collect-all tkinterdnd2 `
            --name aescrypto `
            main.py

      - name: Rename Windows executable
        shell: pwsh
        run: |
          Rename-Item `
            -Path "dist\aescrypto.exe" `
            -NewName "aescrypto-windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: aescrypto-windows
          path: dist/aescrypto-windows.exe
          if-no-files-found: error


  # ============================================================
  # WINDOWS RELEASE
  # ============================================================

  release-windows:
    name: Release Windows

    needs:
      - build-windows

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: aescrypto-windows
          path: release

      - name: Show release files
        run: |
          ls -la release

      - name: Create Windows GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          gh release create "${{ github.ref_name }}" \
            release/aescrypto-windows.exe \
            --title "${{ github.ref_name }}" \
            --generate-notes


  # ============================================================
  # LINUX RELEASE
  # ============================================================

  release-linux:
    name: Release Linux

    needs:
      - build-linux

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:

      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: aescrypto-linux
          path: release

      - name: Show release files
        run: |
          ls -la release

      - name: Create Linux GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          gh release create "${{ github.ref_name }}" \
            release/aescrypto-linux \
            --title "${{ github.ref_name }}" \
            --generate-notes
